<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico">
<title>提示词工作台</title>
<script>try{if((JSON.parse(localStorage.getItem('settings')||'{}')||{}).theme==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:#1c2940;
    font:13.5px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(950px 520px at 2% -8%, rgba(255,138,181,.14), transparent 62%),
      radial-gradient(1050px 600px at 98% -10%, rgba(76,139,245,.13), transparent 62%),
      #f5f8fd;
    display:flex;flex-direction:column;
  }
  header{
    height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
    margin:8px 10px 0;background:#fff;border:1px solid #e9f0fa;border-radius:18px;
    box-shadow:0 6px 22px rgba(76,139,245,.08);
  }
  .logo{font-size:19px;font-weight:700;white-space:nowrap}
  .logo b{color:#4c8bf5}
  .logo i{font-style:normal;color:#e6b45c}
  .steps{display:flex;gap:6px;font-size:12.5px;color:#8494ab}
  .steps i{font-style:normal;background:#f4f8fe;border:1px solid #e7effb;border-radius:999px;padding:3px 12px}
  .steps i.on{background:#e9f2ff;border-color:#bcd7ff;color:#2f6fe0;font-weight:600}
  .guide{font-size:12.5px;color:#8494ab;cursor:pointer}
  .sp{flex:1}
  .sw{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#40506b;cursor:pointer;white-space:nowrap}
  .sw input{width:14px;height:14px;accent-color:#4c8bf5}
  .sw b{color:#4c8bf5}
  select{height:30px;border:1px solid #dbe6f6;border-radius:10px;background:#fff;color:#2b3852;font-size:12.5px;padding:0 7px;cursor:pointer}
  .btn{height:32px;border-radius:10px;border:1px solid #dbe6f6;background:#fff;color:#3a4a63;font-size:13px;padding:0 14px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:#bcd7ff;color:#2f6fe0}
  .btn.primary{background:linear-gradient(135deg,#5a95f7,#3a72d4);color:#fff;border:0;font-weight:600;box-shadow:0 6px 18px rgba(76,139,245,.26)}
  .btn.sm{height:27px;font-size:12px;padding:0 11px;border-radius:9px}

  main{flex:1;display:flex;gap:8px;padding:8px 10px 0;min-height:0}
  .card{background:#fff;border:1px solid #e9f0fa;border-radius:18px;box-shadow:0 8px 26px rgba(76,139,245,.06);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .libcol{flex:0 0 34%;display:flex;flex-direction:column;min-width:0;min-height:0}
  .nlcard{flex:0 0 118px;min-height:86px}
  .libcard{flex:1 1 0;min-height:0}
  .right{flex:1 1 0;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:320px}
  .rtop{flex:1;display:flex;gap:8px;min-height:0}
  .mid{flex:0 0 38%}
  .res{flex:1}
  .rbot{flex:0 0 30%;display:flex;gap:8px;min-height:0}
  .rbot .card{border-bottom-left-radius:6px;border-bottom-right-radius:6px}
  .draft{flex:2 1 0}
  .tools{flex:1 1 0}

  .hd{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
    border-bottom:1px solid #eef4fc;font-weight:600;font-size:13.5px}
  .hd .sub{color:#93a3b9;font-weight:400;font-size:12px}
  .hd .r{margin-left:auto;color:#8494ab;font-weight:400;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .hd .r:hover{color:#4c8bf5}
  .body{padding:12px;overflow:auto;flex:1;min-height:0}
  .body::-webkit-scrollbar,.taglist::-webkit-scrollbar{width:8px}
  .body::-webkit-scrollbar-thumb,.taglist::-webkit-scrollbar-thumb{background:#e2ebf8;border-radius:8px}

  .libcard .body{display:flex;flex-direction:column;overflow:hidden}
  .nlcard .hd{height:30px;font-size:12.5px}
  .nlb{display:flex;flex-direction:column;padding:8px 10px}
  .nlb textarea{flex:1;min-height:0;width:100%;resize:none;border:1px solid #e4ecf9;border-radius:11px;padding:8px 10px;
    font:13px/1.65 inherit;color:#31415c;background:#fff;outline:none}
  .nlb textarea:focus{border-color:#bcd7ff;box-shadow:0 0 0 3px rgba(76,139,245,.08)}
  .nlrow{display:flex;align-items:center;gap:8px;flex:none}
  .row2{display:flex;gap:8px;margin-bottom:10px;flex:none}
  .drop{flex:0 0 96px;border:1.5px dashed #cfdff5;border-radius:13px;color:#9db0c8;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4;background:#fbfdff;cursor:pointer}
  .drop:hover{border-color:#9fc4f7;color:#5f8fd6}
  /* 搜索框是可编辑 div：不能用 flex 居中，否则 Chrome 会把光标画歪，改成单行块 */
  .search{flex:1;display:block;border:1px solid #e4ecf9;border-radius:13px;
    padding:11px 13px;color:#9db0c8;font-size:12.5px;background:#fff;height:44px;
    line-height:20px;white-space:nowrap;overflow:hidden;min-width:0;outline:none;
    caret-color:#4c8bf5}
  /* 分类芯片 + 操作按钮：放不下就换行，芯片按可用宽度自动减列，不再压成单字 */
  .catwrap{display:flex;flex-wrap:wrap;gap:6px 8px;flex:none;margin-bottom:8px}
  .catgrid{flex:1 1 190px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px;min-width:0}
  .chip{border:1px solid #e2ebf8;border-radius:999px;background:#f8fbfe;color:#46586f;font-size:12px;
    padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:.15s}
  .chip:hover{border-color:#bcd7ff;color:#2f6fe0}
  .chip.on{background:linear-gradient(135deg,#5a95f7,#3a72d4);border-color:transparent;color:#fff;font-weight:600}
  .catact{flex:1 1 168px;display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:5px}
  .act{border:1px solid #e2ebf8;border-radius:999px;background:#f8fbfe;color:#5a6c85;font-size:11.5px;
    padding:5px 3px;text-align:center;white-space:nowrap;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .act:hover{border-color:#bcd7ff;color:#2f6fe0}
  .act.fav{background:#fffbee;border-color:#ffe7b3;color:#a5772a}
  .act.nsfw{background:#fff5f9;border-color:#ffd8e6}
  .act.nsfw .sw{color:#d4507f;font-weight:600}
  .act.hot{background:#ffeef2;border-color:#f2608f;color:#d4507f}
  .submenu{flex:none;border:1px solid #e9f0fa;border-radius:13px;background:#fcfdff;padding:8px 10px;margin-bottom:10px;
    display:flex;align-items:center;gap:8px}
  .submenu-t{font-size:12px;color:#5a6c85;font-weight:600;flex:none}
  .submenu-list{display:flex;flex-wrap:wrap;gap:5px}
  .submenu-list span{border:1px solid #e6eef9;border-radius:999px;background:#fff;font-size:11.5px;color:#46586f;padding:3px 10px;cursor:pointer}
  .submenu-list span:hover{border-color:#bcd7ff;color:#2f6fe0}
  .submenu-list span.on{background:linear-gradient(135deg,#5a95f7,#3a72d4);border-color:transparent;color:#fff;font-weight:600}
  .submenu-list .cust{border-color:#bcd7ff;background:#f5faff;color:#2f6fe0}
  .submenu-list .addchar{border-style:dashed;border-color:#bcd7ff;color:#2f6fe0;background:#f5faff}
  /* 标签卡：按可用宽度自动增减列，每列至少 132px 并均分剩余空间，1920 宽下 4 列 */
  .taglist{flex:1;min-height:0;overflow-y:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    grid-auto-rows:min-content;gap:7px;align-content:start;padding-right:2px}
  .tag{border:1px solid #eef4fc;border-radius:9px;padding:5px 7px;background:#fbfdff;font-size:12px;
    line-height:1.45;color:#41526b;cursor:grab;transition:.15s;position:relative}
  .tag:hover{border-color:#bcd7ff;box-shadow:0 6px 16px rgba(76,139,245,.1);transform:translateY(-1px)}
  .tag .zht{display:block;font-weight:600;color:#2f405c;padding-left:14px}
  .tag i{display:block;color:#9db0c8;font-size:11px;font-style:normal;margin-top:1px}
  .favbtn{position:absolute;left:6px;top:4px;color:#d7e0ec;font-size:10px;cursor:pointer;line-height:1}
  .favbtn:hover,.favbtn.on{color:#f0b429}
  .empty{padding:26px;text-align:center;color:#93a3b9;grid-column:1/-1}

  .ok{background:#f2fbf6;border:1px solid #d7f0e2;color:#2f9e6d;border-radius:11px;padding:7px 12px;font-size:12px;margin-bottom:10px}
  .box{border:1px solid #eef4fc;border-radius:13px;padding:10px;margin-bottom:10px;background:#fcfdff}
  .box .n{display:flex;align-items:center;font-weight:700;font-size:13px;margin-bottom:7px;color:#27364f}
  .box .n .x{margin-left:auto;color:#c8d3e2;cursor:pointer;font-weight:400}
  .box .n .x:hover{color:#f2608f}
  .tlist{display:flex;flex-wrap:wrap;gap:5px}
  .t{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #e6eef9;border-radius:9px;
    padding:2px 5px 2px 8px;font-size:11.5px;color:#48596f;cursor:grab}
  .t:hover{border-color:#bcd7ff;color:#2f6fe0}
  .t .tz{white-space:nowrap}
  .w{display:inline-flex;align-items:center;gap:1px;color:#a2b0c3;font-size:10.5px}
  .w b{color:#4c8bf5;font-weight:600;min-width:22px;text-align:center;font-size:11px}
  .w span{cursor:pointer;padding:1px 5px;border-radius:5px;transition:background .12s,color .12s}
  .w span:hover{background:#eaf2ff;color:#2f6fe0}
  .t .del{color:#c3cedd;font-size:11px;line-height:1;cursor:pointer;padding:0 1px;transition:color .12s}
  .t .del:hover{color:#f2608f}
  .hintdrop{color:#b6c3d6;font-size:11.5px}
  .gsec{border-top:1px dashed #eef4fc;padding-top:10px}
  .gn{display:flex;align-items:center;font-weight:700;font-size:13px;margin-bottom:7px;color:#27364f}
  .gn .x{margin-left:auto;color:#c8d3e2;cursor:pointer;font-weight:400}
  .tgrid{display:flex;flex-wrap:wrap;gap:7px;min-height:30px}
  .tcard{border:1px solid #e6eef9;border-radius:9px;background:#fff;padding:3px 8px;line-height:1.25;min-width:140px;position:relative;cursor:grab}
  .tcard:hover{border-color:#bcd7ff;box-shadow:0 4px 12px rgba(76,139,245,.08)}
  .tcard .x{position:absolute;right:6px;top:2px;color:#c8d3e2;cursor:pointer}
  .tcard .s{color:#f0b429;font-size:10.5px;margin-right:4px}
  .tcard .zh{font-size:11.5px;font-weight:600;color:#2f405c}
  .tcard .en{display:block;font-size:11px;color:#9db0c8;margin-top:0}
  .tcard .row{display:flex;align-items:center;gap:3px;margin-top:2px;color:#98a6bb;font-size:9.5px}
  .tcard .row b{color:#4c8bf5;font-size:11px}

  .swchips{display:flex;gap:5px;margin-left:10px}
  .swchip{border:1px solid #e2ebf8;border-radius:999px;background:#f8fbfe;color:#8f9fb5;font-size:11.5px;
    padding:3px 12px;cursor:pointer;transition:.15s}
  .swchip.on{background:linear-gradient(135deg,#5a95f7,#3a72d4);border-color:transparent;color:#fff;font-weight:600}
  .lbl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;margin:14px 0 6px;color:#27364f}
  .lbl:first-child{margin-top:0}
  .lbl .r{margin-left:auto;display:flex;gap:8px;color:#8494ab;font-weight:400;font-size:11.5px}
  .lbl .r u{text-decoration:none;cursor:pointer}
  .lbl .r u:hover{color:#4c8bf5}
  .out{border:1px solid #eef4fc;border-radius:11px;background:#fbfdff;padding:10px 12px;font-size:12px;
    line-height:1.8;color:#3a4b64;white-space:pre-wrap;max-height:220px;overflow:auto}
  .note{color:#93a3b9;font-size:12px}

  .mbody{flex:1;min-height:0;display:flex}
  .mbody textarea{flex:1;border:0;resize:none;padding:12px 14px;font:13px/1.85 inherit;color:#2b3a52;background:#fcfdff;outline:none}

  .hist{border:1px solid #eef4fc;border-radius:11px;padding:8px 10px;margin-bottom:7px;cursor:pointer;background:#fcfdff;transition:.15s}
  .hist:hover{border-color:#bcd7ff;background:#fff;transform:translateY(-1px)}
  .hist .ht{font-size:11px;color:#8fa3bd}
  .hist .hx{font-size:11.5px;color:#41526b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .grip-v{flex:0 0 8px;cursor:col-resize;border-radius:5px;background:#f7fafd;position:relative}
  .grip-v:before{content:"";position:absolute;left:3px;top:30%;bottom:30%;width:2px;background:#d7e4f6;border-radius:2px}
  .grip-v:hover{background:#eef5ff}
  .grip-h{height:8px;flex:0 0 8px;cursor:row-resize;background:#f7fafd;border-radius:5px;margin:-2px 0;position:relative}
  .grip-h:before{content:"";position:absolute;left:48%;right:48%;top:3px;height:2px;background:#d7e4f6;border-radius:2px}
  .grip-h:hover{background:#eef5ff}

  .catact .act{height:26px;padding:0 4px;font-size:11px;border-radius:9px}
  .catact .act .sw{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;font-size:11px}
  .catact .act input{width:12px;height:12px;margin:0}

  #nl,#draft{color:#111 !important;font-weight:500}
  #nl::placeholder{color:#b6c3d6;font-weight:400}

  /* 结果区头部：文字不折行，标签多了自动换行，不挤压 */
  .hd{white-space:nowrap;flex-wrap:wrap;height:auto;min-height:44px;padding-top:6px;padding-bottom:6px;row-gap:6px}
  .hd .r,.hd u,.hd .sub{white-space:nowrap;margin-left:auto}
  .swchips{display:flex;flex-wrap:wrap;gap:5px;margin-left:10px;min-width:0}
  .swchip{flex:0 0 auto;white-space:nowrap}
  #resBody .lbl{white-space:nowrap}

  /* 结果区右上角：译文三档分段控件 + 清空 */
  .hdright{margin-left:auto;display:flex;align-items:center;gap:10px}
  .hdright .r{margin-left:0}
  .trctl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8494ab}
  .trctl-t{white-space:nowrap}
  .seg{display:flex;border:1px solid #e2ebf8;border-radius:8px;overflow:hidden;background:#f8fbfe}
  .segbtn{border:0;background:transparent;color:#7d8fa8;font-size:11.5px;line-height:1;padding:5px 9px;cursor:pointer;font-family:inherit}
  .segbtn + .segbtn{border-left:1px solid #e8f0fb}
  .segbtn:hover{color:#2f6fe0}
  .segbtn.on{background:linear-gradient(135deg,#5a95f7,#3a72d4);color:#fff;font-weight:600}

  /* 一条提示词一个框：英文原文 + 中文译文同框 */
  .pair{border:1px solid #eef4fc;border-radius:11px;background:#fbfdff;overflow:hidden}
  .pair .out{border:0;border-radius:0;background:transparent}
  .tr{border-top:1px dashed #e4edfa;background:#f6faff;padding:7px 12px;
    font-size:11.5px;line-height:1.8;color:#5a6c85;word-break:break-word}
  .tr .tp{display:inline-block;margin:0 9px 3px 0}
  .tr .tp b{color:#2f405c;font-weight:600;margin-right:4px}
  .tr .tp span{color:#7d8fa8}
  .tr .th{display:block;font-size:10.5px;color:#a9b8cb;margin-bottom:3px}

  /* ===== 日夜切换开关（素材来自 ai/日月） ===== */
  .dnswitch{display:block;width:50px;height:23px;margin-left:-6px;padding:0;border:0;background:transparent;cursor:pointer;
    outline:none;border-radius:999px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.16));
    transition:filter .5s,transform .3s}
  .dnswitch:hover{filter:drop-shadow(0 4px 12px rgba(0,0,0,.22))}
  .dnswitch:active{transform:scale(.97)}
  .dnswitch .switch-svg{display:block;width:100%;height:auto;overflow:visible}
  .dnswitch .sky-top,.dnswitch .sky-bot,.dnswitch .band-stop{transition:stop-color .85s cubic-bezier(.5,.06,.24,1)}
  .dnswitch .sky-top{stop-color:#0d1421}
  .dnswitch .sky-bot{stop-color:#192131}
  .dnswitch.is-day .sky-top{stop-color:#3f7fbe}
  .dnswitch.is-day .sky-bot{stop-color:#93c4ea}
  .dnswitch .bands{animation:dnDrift 18s ease-in-out infinite}
  @keyframes dnDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-13px,-5px)}}
  .dnswitch .band{transition:transform 1.05s cubic-bezier(.5,.06,.24,1)}
  .dnswitch .s1{stop-color:#1a2338}
  .dnswitch .s2{stop-color:#242f47}
  .dnswitch .s3{stop-color:#303d5d}
  .dnswitch .s4{stop-color:#404e73}
  .dnswitch.is-day .s1{stop-color:#6aa2dd}
  .dnswitch.is-day .s2{stop-color:#7cb2e5}
  .dnswitch.is-day .s3{stop-color:#8fc0ec}
  .dnswitch.is-day .s4{stop-color:#a6d0f4}
  .dnswitch .b1{fill:url(#bg1)}
  .dnswitch .b2{fill:url(#bg2)}
  .dnswitch .b3{fill:url(#bg3)}
  .dnswitch .b4{fill:url(#bg4)}
  .dnswitch.is-day .b1{transform:translateX(-34px)}
  .dnswitch.is-day .b2{transform:translateX(-24px)}
  .dnswitch.is-day .b3{transform:translateX(-14px)}
  .dnswitch.is-day .b4{transform:translateX(-6px)}
  .dnswitch .clouds{opacity:0;transition:opacity .7s cubic-bezier(.35,.1,.6,.9) .1s}
  .dnswitch.is-day .clouds{opacity:1;transition:opacity .52s cubic-bezier(.3,.7,.3,1) .06s}
  .dnswitch .cloud{transform:translateY(60px);transition:transform .82s cubic-bezier(.52,.04,.22,1)}
  .dnswitch .cloud-inner{transform-box:fill-box;transform-origin:50% 100%;
    transform:scaleY(.74) scaleX(1.04);transition:transform .82s cubic-bezier(.52,.04,.22,1)}
  .dnswitch.is-day .cloud{transform:translateY(0)}
  .dnswitch.is-day .cloud-inner{transform:scaleY(1) scaleX(1);transition:transform .74s cubic-bezier(.34,1.6,.5,1)}
  .dnswitch .fill-light{fill:#cfe4f7}
  .dnswitch .fill-white{fill:#fff}
  .dnswitch .star{transform-box:view-box;transform-origin:0 0;opacity:var(--o,1)}
  .dnswitch.is-day .star{opacity:0;transform:translateY(var(--ty,-140px))}
  .dnswitch .inner-shadow{transition:opacity .85s cubic-bezier(.5,.06,.24,1)}
  .dnswitch.is-day .inner-shadow{opacity:.62}
  .dnswitch .knob{transform:translate(412px,150px);transition:transform .82s cubic-bezier(.52,.04,.22,1)}
  .dnswitch.is-day .knob{transform:translate(148px,150px)}
  .dnswitch .halo-night,.dnswitch .halo-day{transition:opacity .8s ease-out}
  .dnswitch.is-day .halo-night{opacity:0}
  .dnswitch .knob-shadow{transition:opacity .85s cubic-bezier(.5,.06,.24,1)}
  .dnswitch.is-day .knob-shadow{opacity:.4}
  .dnswitch .face-night{transition:opacity .6s cubic-bezier(.45,0,.3,1) .1s}
  .dnswitch.is-day .face-night{opacity:0;transition-delay:.14s}
  .dnswitch .crater{transition:fill .58s cubic-bezier(.5,.06,.24,1),transform .82s cubic-bezier(.5,.06,.24,1),opacity .48s cubic-bezier(.45,0,.3,1);
    transition-delay:0s,0s,.16s}
  .dnswitch .c1{fill:#adc1d5;transform:translate(-16px,8px)}
  .dnswitch .c2{fill:#adc1d5;transform:translate(22px,-24px)}
  .dnswitch .c3{fill:#adc1d5;transform:translate(26px,24px)}
  .dnswitch.is-day .c1{fill:#d9a63d;transform:translate(-12px,2px)}
  .dnswitch.is-day .c2{fill:#d9a63d;transform:translate(24px,-18px)}
  .dnswitch.is-day .c3{fill:#d9a63d;transform:translate(18px,28px)}
  .dnswitch.is-day .crater{opacity:0;transition-delay:0s,0s,.08s}

  /* 切主题时整页配色渐变（只在切换的瞬间挂 .theming） */
  html.theming body,html.theming header,html.theming .card,html.theming .hd,html.theming .tag,
  html.theming .tcard,html.theming .chip,html.theming .act,html.theming .btn,html.theming select,
  html.theming .search,html.theming .drop,html.theming .out,html.theming .pair,html.theming .tr,
  html.theming .lbl,html.theming .lbl .r,html.theming .swchip,html.theming .submenu,
  html.theming .submenu-t,html.theming .submenu-list span,html.theming .box,html.theming .box .n,
  html.theming .gn,html.theming .t,html.theming .w,html.theming .hist,html.theming .grip-v,
  html.theming .grip-h,html.theming .nlb textarea,html.theming .mbody textarea,html.theming .seg,
  html.theming .segbtn,html.theming .trctl,html.theming .dlg,html.theming .fi,html.theming .note,
  html.theming .steps i,html.theming .logo b,html.theming .tag .zht,html.theming .tag i,
  html.theming .tcard .zh,html.theming .tcard .en,html.theming .tcard .row,html.theming .tr .tp b,
  html.theming .tr .tp span,html.theming .tr .th,html.theming .out,html.theming .ok,html.theming .favbtn,
  html.theming .hist .hx,html.theming .hist .ht,html.theming .guide,html.theming .hd .sub{
    transition: background-color .42s ease, color .42s ease, border-color .42s ease, fill .42s ease;
  }

  /* ===== 通用浮层 ===== */
  .dlgmask{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:999;
    background:rgba(20,30,50,.35)}
  .dlg{max-height:86vh;overflow:auto;background:#fff;border-radius:16px;padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .dlg-t{font-weight:700;font-size:15px;margin-bottom:14px}
  .dlg-l{font-size:12px;color:#5a6c85}
  .dlg-gap{height:10px}
  .dlg-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .fi{width:100%;height:34px;border:1px solid #dbe6f6;border-radius:9px;padding:0 10px;font-size:13px;
    background:#fff;color:#2b3852;font-family:inherit}
  .fi:focus{outline:none;border-color:#bcd7ff;box-shadow:0 0 0 3px rgba(76,139,245,.1)}

  /* ===== 黑夜模式 ===== */
  .dark body{color:#c9d3e1;background:
      radial-gradient(900px 520px at 2% -8%, rgba(96,64,120,.22), transparent 62%),
      radial-gradient(1000px 560px at 98% -10%, rgba(40,80,150,.24), transparent 62%),
      #0f131a}

  .dark .logo b{color:#6ea0f7}
  .dark .steps i{background:#1a2029;border-color:#28313d;color:#8593a8}

  .dark .card{background:#151a22;border-color:#232b36;box-shadow:0 8px 24px rgba(0,0,0,.32)}
  .dark .hd{border-bottom-color:#222a35}

  .dark .drop{border-color:#31405a;background:#151b24;color:#7c8ca3}
  .dark .search{background:#151b24;border-color:#252e3a;color:#6f7f95}

  .dark .act{background:#1a212b;border-color:#2a3341;color:#93a1b4}
  .dark .act.fav{background:#2a2416;border-color:#4a3d20;color:#d9ab55}
  .dark .act.nsfw{background:#2a1a22;border-color:#4a2a3a}
  .dark .act.hot{background:#361d26;border-color:#7a3550;color:#e581a6}
  .dark .submenu{background:#151b24;border-color:#232b36}
  .dark .submenu-t{color:#93a1b4}
  .dark .submenu-list span{background:#1a212b;border-color:#2a3341;color:#a9b6c7}
  .dark .tag{background:#1a212b;border-color:#222b36;color:#b6c3d3}
  .dark .tag .zht{color:#dde6f2}
  .dark .tag i{color:#7d8ba0}
  .dark .favbtn{color:#3f4b5d}
  .dark .ok{background:#16281f;border-color:#234a35;color:#63c996}
  .dark .box{background:#161c25;border-color:#232b36}
  .dark .box .n,.dark .gn{color:#dae3ef}
  .dark .t{background:#1a212b;border-color:#2a3341;color:#a9b6c7}
  .dark .w span:hover{background:#243348;color:#8fb6f5}
  .dark .t .del{color:#4a5666}
  .dark .w{color:#7a8799}
  .dark .tcard{background:#1a212b;border-color:#2a3341}
  .dark .tcard .zh{color:#dde6f2}
  .dark .tcard .en{color:#7d8ba0}
  .dark .tcard .row{color:#7a8799}
  .dark .nlb textarea{background:#121821;border-color:#2a3341;color:#e2e9f3}
  .dark .mbody textarea{background:#141a22;color:#dbe3ee}
  .dark .swchip{background:#1a212b;border-color:#2a3341;color:#8695aa}
  .dark .lbl{color:#dde6f2}
  .dark .lbl .r{color:#7f8da2}
  .dark .seg{background:#1a212b;border-color:#2a3341}
  .dark .segbtn{color:#8695aa}
  .dark .segbtn + .segbtn{border-left-color:#2a3341}
  .dark .segbtn:hover{color:#8fb6f5}
  .dark .trctl{color:#7f8da2}
  .dark .pair{border-color:#232b36;background:#161c25}
  .dark .out{color:#c2cfe0}
  .dark .tr{border-top-color:#26303d;background:#121821;color:#93a1b4}
  .dark .tr .th{color:#6d7b90}
  .dark .tr .tp b{color:#cfd9e6}
  .dark .tr .tp span{color:#8f9db2}
  .dark .hist{background:#161c25;border-color:#232b36}
  .dark .hist .ht{color:#7a8799}
  .dark .hist .hx{color:#b6c3d3}
  .dark .grip-v,.dark .grip-h{background:#141a22}
  .dark .grip-v:before{background:#2b3543}
  .dark .grip-h:before{background:#2b3543}
  .dark .dlg{background:#161c25;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .dark .dlg-l{color:#8b99ae}
  .dark .fi{background:#121821;border-color:#2d3644;color:#dbe3ee}

  /* 说明书弹层（自身样式是运行时注入的，得用 !important 盖） */
  .dark #guideDlg .gtabs,.dark #guideDlg .gfoot{background:#151a22!important;border-color:#232b36!important}
  .dark #guideDlg .gbody{background:#12171e!important}
  .dark #guideDlg .gtab{background:#1a212b!important;border-color:#2a3341!important;color:#8695aa!important}
  .dark #guideDlg .gtab.on{background:linear-gradient(135deg,#4d7ede,#6a5ae0)!important;border-color:transparent!important;color:#fff!important}
  .dark #guideDlg .glead{background:linear-gradient(120deg,#1a2333,#211d33)!important;border-color:#2a3444!important}
  .dark #guideDlg .glead-t,.dark #guideDlg .gk h4{color:#e2eaf6!important}
  .dark #guideDlg .glead-s,.dark #guideDlg .gk p,.dark #guideDlg .grow span{color:#9aa8bd!important}
  .dark #guideDlg .gtitle{color:#7d8ba0!important}
  .dark #guideDlg .gk{background:#1a212b!important;border-color:#2a3341!important;box-shadow:none!important}
  .dark #guideDlg .gk.hi{background:linear-gradient(135deg,#1a2434,#211d33)!important}
  .dark #guideDlg .grow{background:#1a212b!important;border-color:#2a3341!important}
  .dark #guideDlg .gmini span{background:#1d2c45!important;color:#8fb6f5!important}
  .dark #guideDlg .gsteps span{background:#1a212b!important;border-color:#2f4a74!important;color:#8fb6f5!important}
  .dark #guideDlg .gnote{background:#2a2416!important;border-color:#4a3d20!important;color:#d9c08a!important}
  .dark #guideDlg .ghint{color:#7b8899!important}
  .dark .dnswitch{filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
</style>
</head>
<body>

<header>
  <div class="logo"><i>✦</i> 提示词<b>工作台</b> <i>✦</i></div>
  <button class="dnswitch is-day" id="btnTheme" type="button" role="switch" aria-checked="false" title="切换日间 / 夜间模式" aria-label="切换日间 / 夜间模式">
      <svg class="switch-svg" viewBox="40 40 480 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="pillClip">
            <rect x="50" y="52" width="460" height="196" rx="98"/>
          </clipPath>
  
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0.1" y2="1">
            <stop class="sky-top" offset="0"/>
            <stop class="sky-bot" offset="1"/>
          </linearGradient>
  
          <!-- 色带填充：内侧实心，靠近边缘按透明度渐隐，做出柔和的弧形过渡带 -->
          <radialGradient id="bg1">
            <stop class="band-stop s1" offset=".84"/>
            <stop class="band-stop s1" offset="1" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bg2">
            <stop class="band-stop s2" offset=".82"/>
            <stop class="band-stop s2" offset="1" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bg3">
            <stop class="band-stop s3" offset=".80"/>
            <stop class="band-stop s3" offset="1" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bg4">
            <stop class="band-stop s4" offset=".78"/>
            <stop class="band-stop s4" offset="1" stop-opacity="0"/>
          </radialGradient>
  
          <linearGradient id="innerTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"    stop-color="#000" stop-opacity=".42"/>
            <stop offset="0.10" stop-color="#000" stop-opacity=".12"/>
            <stop offset="0.38" stop-color="#000" stop-opacity="0"/>
            <stop offset="1"    stop-color="#000" stop-opacity="0"/>
          </linearGradient>
  
          <linearGradient id="rimLight" x1="0.1" y1="0" x2="0.62" y2="1">
            <stop offset="0"   stop-color="#ffffff" stop-opacity=".7"/>
            <stop offset=".5"  stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="1"   stop-color="#ffffff" stop-opacity=".15"/>
          </linearGradient>
  
          <radialGradient id="knobNight" cx="34%" cy="26%" r="84%">
            <stop offset="0"   stop-color="#fdfcf7"/>
            <stop offset=".46" stop-color="#f2f0e9"/>
            <stop offset=".8"  stop-color="#e1ded4"/>
            <stop offset="1"   stop-color="#cdcac0"/>
          </radialGradient>
  
          <radialGradient id="knobDay" cx="34%" cy="26%" r="84%">
            <stop offset="0"   stop-color="#ffe685"/>
            <stop offset=".4"  stop-color="#ffc82a"/>
            <stop offset=".82" stop-color="#f8b200"/>
            <stop offset="1"   stop-color="#e89c00"/>
          </radialGradient>
  
          <radialGradient id="haloNight" cx="50%" cy="50%" r="50%">
            <stop offset=".74" stop-color="#dce9ff" stop-opacity="0"/>
            <stop offset=".80" stop-color="#f6faff" stop-opacity=".42"/>
            <stop offset=".86" stop-color="#ffffff" stop-opacity=".10"/>
            <stop offset=".95" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
  
          <radialGradient id="haloDay" cx="50%" cy="50%" r="50%">
            <stop offset=".76" stop-color="#ffe07a" stop-opacity="0"/>
            <stop offset=".82" stop-color="#ffdc66" stop-opacity=".20"/>
            <stop offset=".92" stop-color="#ffd85c" stop-opacity=".06"/>
            <stop offset="1"   stop-color="#ffd85c" stop-opacity="0"/>
          </radialGradient>
  
          <radialGradient id="knobShadow" cx="50%" cy="50%" r="50%">
            <stop offset=".45" stop-color="#0c1524" stop-opacity=".30"/>
            <stop offset=".72" stop-color="#0c1524" stop-opacity=".15"/>
            <stop offset="1"   stop-color="#0c1524" stop-opacity="0"/>
          </radialGradient>
  
          <!-- 四角星芒 -->
          <path id="spark" d="M0,-1 C0.09,-0.23 0.23,-0.09 1,0 C0.23,0.09 0.09,0.23 0,1 C-0.09,0.23 -0.23,0.09 -1,0 C-0.23,-0.09 -0.09,-0.23 0,-1 Z"/>
        </defs>
  
        <g clip-path="url(#pillClip)">
          <!-- 天空 -->
          <rect class="sky" x="50" y="52" width="460" height="196" fill="url(#skyGrad)"/>
  
          <!-- 分层弧形色带 -->
          <g class="bands">
            <circle class="band b1" cx="510" cy="150" r="325"/>
            <circle class="band b2" cx="505" cy="150" r="260"/>
            <circle class="band b3" cx="500" cy="150" r="200"/>
            <circle class="band b4" cx="495" cy="150" r="150"/>
          </g>
  
          <!-- 云层：后排浅云（多峰，与主云错峰咬合） → 前排白云 -->
          <g class="clouds">
            <g class="cloud d2 fill-light">
              <g class="cloud-inner">
                <path d="M 344,258
                         C 342,238 354,224 372,226
                         C 378,200 392,190 408,194
                         C 418,178 442,176 452,190
                         C 470,192 480,204 481,218
                         C 494,224 502,240 502,258 Z"/>
              </g>
            </g>
  
            <g class="cloud d3 fill-white">
              <g class="cloud-inner">
                <path d="M 282,258
                         C 284,232 302,218 322,222
                         C 332,198 358,188 378,196
                         C 390,172 424,168 438,190
                         C 458,184 476,198 478,218
                         C 495,224 506,240 506,258 Z"/>
              </g>
            </g>
          </g>
  
          <!-- 星芒（JS 注入） -->
          <g class="stars"></g>
  
          <!-- 内凹阴影 -->
          <rect class="inner-shadow" x="50" y="52" width="460" height="196" fill="url(#innerTop)"/>
  
          <!-- 旋钮 -->
          <g class="knob">
            <circle class="halo halo-day"   cx="0" cy="0" r="100" fill="url(#haloDay)"/>
            <circle class="halo halo-night" cx="0" cy="0" r="100" fill="url(#haloNight)"/>
            <circle class="knob-shadow" cx="4" cy="16" r="82" fill="url(#knobShadow)"/>
  
            <circle class="face face-day"   r="78" fill="url(#knobDay)"/>
            <circle class="face face-night" r="78" fill="url(#knobNight)"/>
            <circle r="77.5" fill="none" stroke="url(#rimLight)" stroke-width="2" opacity=".85"/>
  
            <g class="craters">
              <circle class="crater c1" r="21"/>
              <circle class="crater c2" r="13"/>
              <circle class="crater c3" r="12"/>
            </g>
          </g>
        </g>
  
        <!-- 轨道外缘 -->
        <rect x="50" y="52" width="460" height="196" rx="98"
              fill="none" stroke="rgba(0,0,0,.13)" stroke-width="1.5"/>
      </svg>
    </button>
  <div class="steps"><i>① 反推 / 描述</i><i class="on">② 挑标签</i><i>③ 出结果</i></div>
  <div class="guide">📖 说明书</div>
  <div class="sp"></div>
  <label class="sw"><input type="checkbox" id="swApi" checked><b>API</b></label>
  <label class="sw"><input type="checkbox" id="swNsfwTop">NSFW模式</label>
  <select id="selPolish"><option value="api" selected>润色 API</option><option value="local">润色 本地</option><option value="off">润色 关</option><option value="tmpl">润色 模板</option></select>
  <select id="selDensity"><option value="compact">精简</option><option value="normal" selected>标准</option><option value="complex">复杂</option></select>
  <select id="selNeg"><option value="full" selected>负向 完整</option><option value="simple">负向 精简</option><option value="off">负向 关</option></select>
  <button class="btn" id="btnCfg">⚙ API</button>
  <button class="btn primary" id="btnGen">生成结果</button>
</header>

<main>
  <div class="libcol">
  <section class="card nlcard" id="nlCard">
    <div class="hd">扩写<span class="r"><button class="btn sm" id="btnExpand">AI 扩写</button></span></div>
    <div class="body nlb">
      <textarea id="nl" placeholder="例：2个角色 初音未来 洛天依&#10;初音未来：蓝色长双马尾，青色眼睛，穿白色连衣裙，站在窗边，微笑&#10;场景：教室，午后阳光斜照进来，桌面有书和笔"></textarea>
    </div>
  </section>

  <div class="grip-h" id="gripNL" title="拖动调整扩写区高度"></div>

  <section class="card libcard">
    <div class="hd">标签库 <span class="sub" id="libCount">加载中…</span><span class="r" id="btnReset">重置筛选</span></div>
    <div class="body">
      <div class="row2">
        <div class="drop" id="dropImg">点此选图反推<br>或拖图</div>
        <div class="search" id="searchBox">🔍 搜索：蓝发 / long hair / 女仆 / 制服</div>
      </div>
      <input type="file" id="fileImg" accept="image/*" style="display:none">

      <div class="catwrap">
        <div class="catgrid" id="catGrid"></div>
        <div class="catact" id="catAct"></div>
      </div>

      <div class="submenu" id="submenu" style="display:none">
        <div class="submenu-t" id="subTitle">角色</div>
        <div class="submenu-list" id="subList"></div>
      </div>

      <div class="taglist" id="tagList"></div>
    </div>
  </section>
  </div>

  <div class="grip-v"></div>

  <section class="right">
    <div class="rtop">
      <div class="card mid">
        <div class="hd">已选 <span class="sub" id="selCount">0</span><span class="r" id="btnClearSel">清空</span></div>
        <div class="body" id="selBody"></div>
      </div>
      <div class="grip-v"></div>
      <div class="card res">
        <div class="hd">结果 <span class="swchips" id="secChips"></span>
          <span class="hdright">
            <span class="trctl" id="trCtl" title="用微软免鉴权接口给提示词补中文">
              <span class="trctl-t">译文</span>
              <span class="seg">
                <button type="button" class="segbtn on" data-tr="off">关</button>
                <button type="button" class="segbtn" data-tr="sentence">整段</button>
                <button type="button" class="segbtn" data-tr="tokens">逐词</button>
              </span>
            </span>
            <span class="r" id="btnClearRes">清空结果</span>
          </span></div>
        <div class="body" id="resBody"><div class="note" style="padding:26px;text-align:center">点「生成结果」后显示</div></div>
      </div>
    </div>

    <div class="grip-h"></div>

    <div class="rbot">
      <div class="card draft">
        <div class="hd">草稿 <span class="sub">可编辑 · 改完拆标签 / 生成 MOSS</span>
          <span class="r">
            <button class="btn sm" id="btnParseDraft">拆成标签</button>
            <button class="btn sm primary" id="btnMoss">生成 MOSS</button>
          </span>
        </div>
        <div class="mbody"><textarea id="draft"></textarea></div>
      </div>
      <div class="grip-v"></div>
      <div class="card tools">
        <div class="hd">历史记录 <span class="sub">点一条回填到草稿</span><span class="r" id="btnClearHist">清空</span></div>
        <div class="body" id="histBody"><div class="note">还没有扩写记录</div></div>
      </div>
    </div>
  </section>
</main>

<script src="app.js?v=20261122tagfix"></script>
</body>
</html>
